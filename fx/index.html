<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НЕБАФФЕТТ · МОНИТОР — Валюта</title>
<link rel="icon" type="image/svg+xml" href="https://nebuff.ru/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="https://nebuff.ru/assets/favicon-32.png">
<link rel="apple-touch-icon" href="https://nebuff.ru/assets/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #fff; transition: opacity .4s; pointer-events: none;
  }
  .mark { width: 52px; height: 52px; }
  #loader .mark { animation: pulse 1.6s ease-in-out infinite; }
  .brand {
    font-family: 'Unbounded', sans-serif; font-weight: 600;
    font-size: 15px; letter-spacing: .06em; color: #111;
  }
  #loader .note {
    font-family: 'Montserrat', 'Trebuchet MS', sans-serif;
    font-size: 13px; color: #8a8a8a;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(.92); opacity: .75; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loader .mark { animation: none; }
  }
  #gate {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #fff; padding: 20px; text-align: center;
  }
  #gate .gnote {
    font-family: 'Montserrat', 'Trebuchet MS', sans-serif;
    font-size: 13px; color: #666; line-height: 1.5; max-width: 340px;
  }
  #gate input {
    font-family: 'Montserrat', sans-serif; font-size: 15px; color: #111;
    border: 1px solid #E6E6E6; border-radius: 12px; padding: 12px 16px;
    width: min(300px, 78vw); outline: none; text-align: center;
  }
  #gate input:focus { border-color: #3E44F5; }
  #gate button {
    font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 14px;
    color: #fff; background: #3E44F5; border: none; border-radius: 999px;
    padding: 11px 30px; cursor: pointer;
  }
  #gate button:hover { background: #2b30c9; }
</style>
</head>
<body>
<div id="loader">
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#3E44F5"/>
    <rect x="11" y="13" width="42" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <polyline points="18,33 26,26 33,30 45,20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29" y="41" width="6" height="6" fill="#FFFFFF"/>
    <rect x="21" y="47" width="22" height="5" rx="2.5" fill="#FFFFFF"/>
  </svg>
  <div class="brand">НЕБАФФЕТТ · МОНИТОР</div>
  <div class="note">Загружаем данные…</div>
</div>
<div id="gate">
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#3E44F5"/>
    <rect x="11" y="13" width="42" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <polyline points="18,33 26,26 33,30 45,20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="29" y="41" width="6" height="6" fill="#FFFFFF"/>
    <rect x="21" y="47" width="22" height="5" rx="2.5" fill="#FFFFFF"/>
  </svg>
  <div class="brand">НЕБАФФЕТТ · МОНИТОР</div>
  <div class="gnote">Монитор доступен участникам клуба «Асимметричные инвестиции».<br>Введи пароль из закрытого чата клуба.</div>
  <input id="gate-in" class="ym-disable-keys" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="gate-btn" type="button">Войти</button>
</div>
<iframe id="app" allow="clipboard-write"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbyzZ-oh1E3I_pTbEktqLq9Ev3MBG81-6lRlrrXDCYDxe-A0LTv2JcSo5v-MfS1Qlmi3Pg/exec';

  // Раздел переехал на свой сервер. Пустая строка возвращает его
  // на Apps Script — это и есть откат: одна правка и коммит,
  // без разбирательств с тем, что сломалось.
  var SERVER = 'https://s.nebuff.ru/fx/';

  var RETRY_KEY = 'retried_fx';         // свой ключ на каждый раздел
  var LS_KEY = 'nb_key';             // пароль, общий для всего nebuff.ru

  var qs = new URLSearchParams(location.search);
  // ?reset=1 — забыть сохранённый пароль (ссылка со страницы отказа)
  if (qs.get('reset')) {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }

  var app = document.getElementById('app');
  var loader = document.getElementById('loader');
  var gate = document.getElementById('gate');
  var started = false;

  app.addEventListener('load', function () {
    if (started) loader.style.opacity = 0;
  });

  function buildSrc(key) {
    var база = SERVER || EXEC;
    return key ? (база + '?k=' + encodeURIComponent(key)) : база;
  }

  function start(key) {
    started = true;
    gate.style.display = 'none';
    loader.style.display = 'flex';
    loader.style.opacity = 1;
    var SRC = buildSrc(key);
    app.src = SRC;

    // Одна автоматическая перезагрузка: страховка от сбоя первого запроса
    // к Apps Script в сессии без cookie (инкогнито, первый визит).
    //
    // Своему серверу она не нужна и вредна: он отвечает за десятки
    // миллисекунд, и читатель увидел бы, как открытая страница
    // ни с того ни с сего моргает через две с половиной секунды.
    if (!SERVER) {
      setTimeout(function () {
        if (sessionStorage.getItem(RETRY_KEY)) return;
        sessionStorage.setItem(RETRY_KEY, '1');
        app.src = SRC + (SRC.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now();
      }, 2500);
    }
  }

  function askGate() {
    loader.style.display = 'none';
    gate.style.display = 'flex';
    var input = document.getElementById('gate-in');
    function go() {
      var v = input.value.trim();
      if (!v) return;
      try { localStorage.setItem(LS_KEY, v); } catch (e) {}
      start(v);
    }
    document.getElementById('gate-btn').addEventListener('click', go);
    input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    input.focus();
  }

  var saved = null;
  try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
  if (saved) start(saved); else askGate();
})();
</script>
